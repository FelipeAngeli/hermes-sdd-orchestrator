name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 4e9d3c713a3e3d47319ab18a8d8dfade5665270d
          path: .ci/hermes-agent
          fetch-depth: 1
      - name: Hermes skill security scan
        run: python tools/check_skill_security.py --hermes-root .ci/hermes-agent
      - run: pip install jsonschema
      - name: Skill, installer and documentation tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Installed controller tests
        run: python -m unittest discover -s skills/orchestrate/sdd-orchestrator/templates/.hermes/orchestration/tests -p 'test_*.py'
      - name: Documentation updated with the orchestration
        if: github.event_name == 'pull_request'
        run: python tools/check_docs_sync.py --base "origin/${{ github.base_ref }}"
