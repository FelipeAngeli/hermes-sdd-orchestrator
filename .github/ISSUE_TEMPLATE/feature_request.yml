name: Feature request / improvement
description: Propose an improvement or a new capability for the orchestrator.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please search existing issues first — a 👍 on an existing one helps prioritize it.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or pain does this address? Describe the situation, not the solution yet.
      placeholder: When I run the orchestrator on a monorepo, …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Include commands, file names or example output when useful.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Installer (install_project.py)
        - Stack detection (detect_stack.py)
        - Gates / validation (GATES.md)
        - FSM / loop policy / bounded automation
        - Stage agents (agents/)
        - Sub-agents (sub-agents/)
        - Contracts / schemas
        - Obsidian integration
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you use today, or existing features that come close.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with guidance"
        - "No"
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: The proposal keeps the payload language-neutral and preserves the safety invariants (human approval, protected files, one leaf worker).
