# Opt in by merging this block into a dedicated Hermes profile config.yaml.
# Replace <ABSOLUTE_PROJECT_ROOT> before use with the directory that holds
# .hermes/orchestration: the Obsidian project container (<vault>/<project>) for
# the default storage, or the repository root with --local-storage. Hooks take
# the repository from the event's cwd. Absolute paths keep Hermes' persistent
# (event, command) consent bound to this installation.
hooks:
  pre_tool_call:
    - matcher: "write_file|patch"
      command: 'python3 "<ABSOLUTE_PROJECT_ROOT>/.hermes/orchestration/hooks/enforce-slice-scope.py"'
      timeout: 10
      fail_closed: true
  pre_verify:
    - command: 'python3 "<ABSOLUTE_PROJECT_ROOT>/.hermes/orchestration/hooks/require-verification.py"'
      timeout: 10
  subagent_stop:
    - command: 'python3 "<ABSOLUTE_PROJECT_ROOT>/.hermes/orchestration/hooks/record-subagent-stop.py"'
      timeout: 10
  # Record every Hermes turn and session end of an installed worktree in the
  # project's Obsidian wiki (raw/transcripts/sessions/ and log.md).
  post_llm_call:
    - command: 'python3 "<ABSOLUTE_PROJECT_ROOT>/.hermes/orchestration/hooks/record-turn.py"'
      timeout: 10
  on_session_end:
    - command: 'python3 "<ABSOLUTE_PROJECT_ROOT>/.hermes/orchestration/hooks/record-session-end.py"'
      timeout: 10
  # Optional bounded STATE context; uncomment to enable.
  # pre_llm_call:
  #   - command: 'python3 "<ABSOLUTE_PROJECT_ROOT>/.hermes/orchestration/hooks/inject-state-summary.py"'
  #     timeout: 10
